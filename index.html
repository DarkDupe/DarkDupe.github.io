    /* Centered glass card with Void Purple (#4800A8) accents */
    .glass-card {
      background: rgba(8, 4, 18, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(72, 0, 168, 0.72);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.82), 0 0 42px rgba(72, 0, 168, 0.26), inset 0 1px 0 rgba(192, 0, 255, 0.12);
    }

    /* Purple-gradient Discord button to match the VoidDupe identity */
    .discord-btn {
      background: linear-gradient(115deg, #4800A8 0%, #6D14D9 52%, #8A00FF 100%) !important;
      box-shadow: 0 4px 22px rgba(72, 0, 168, 0.42);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .discord-btn:hover {
      background: linear-gradient(115deg, #5700C7 0%, #7B1BEA 52%, #9A24FF 100%) !important;
      box-shadow: 0 7px 30px rgba(138, 0, 255, 0.5);
      transform: translateY(-2px);
    }

    .ip-btn {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ip-btn:hover {
      box-shadow: 0 6px 25px rgba(72, 0, 168, 0.38);
      transform: translateY(-2px);
    }

    @keyframes slideUp {
      from { transform: translate(-50%, 20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .animate-toast { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

<body class="min-h-screen text-slate-100 flex flex-col justify-between items-center p-4 sm:p-6 font-sans selection:bg-purple-500 selection:text-white">

  <!-- Centered Content Section -->
  <div class="w-full max-w-md my-auto py-8">
    
    <!-- Dark Glassmorphism Invite Card -->
    <div class="glass-card rounded-3xl p-6 sm:p-8 text-center flex flex-col items-center relative overflow-hidden">
      
      <!-- Static Accent Line (No flashing/blinking effects) -->
      <div class="w-20 h-1 bg-gradient-to-r from-transparent via-purple-500 to-transparent rounded-full mb-6 opacity-60"></div>

      <!-- Server Logo (Fetched directly from Discord API with fallback) -->
      <div class="relative mb-4">
        <div class="absolute -inset-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-3xl blur opacity-40"></div>
        <img 
          id="discordIcon"
          src="https://placehold.co/120x120/1a102f/a855f7?text=VD" 
          alt="VoidDupe Icon" 
          class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-2xl object-cover border-2 border-purple-500/30 shadow-2xl bg-slate-900"
          onerror="this.src='https://placehold.co/120x120/1a102f/a855f7?text=VD'"
        />
      </div>

      <!-- Server Name -->
      <h1 id="discordName" class="font-display font-black text-3xl sm:text-4xl tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-purple-200 uppercase">
        VoidDupe
      </h1>

      <!-- Clean Static Discord Member Stats (No pulsing/flashing green dots) -->
      <div class="mt-3 mb-8 flex items-center justify-center gap-3 text-xs sm:text-sm font-medium text-slate-300 bg-slate-900/70 px-4 py-2 rounded-full border border-purple-500/15">
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-user-check text-purple-400 text-xs"></i>
          <span id="discordOnlineCount" class="font-semibold text-slate-200">-- Online</span>
        </div>
        <span class="text-slate-600">•</span>
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-users text-slate-400 text-xs"></i>
          <span id="discordTotalCount" class="text-slate-400">-- Members</span>
        </div>
      </div>

      <!-- Two Long Horizontal Stacked Buttons -->
      <div class="w-full flex flex-col gap-3.5">
        
        <!-- Button 1: Join Discord -->
        <a 
          id="discordBtn"
          href="https://discord.gg/bZWS24azkf" 
          target="_blank" 
          rel="noopener noreferrer"
          class="discord-btn w-full bg-discord hover:bg-discord-hover text-white font-semibold py-3.5 px-6 rounded-xl flex items-center justify-center gap-3 text-base sm:text-lg transition-all"
        >
          <i class="fa-brands fa-discord text-xl"></i>
          <span>Join The Discord!</span>
        </a>

        <!-- Button 2: Copy Server IP -->
        <button 
          id="copyIpBtn"
          onclick="copyServerIp()"
          class="ip-btn w-full bg-slate-900/90 hover:bg-slate-800 text-slate-100 border border-purple-500/30 hover:border-purple-500/60 font-semibold py-3.5 px-6 rounded-xl flex items-center justify-center gap-3 text-base sm:text-lg transition-all cursor-pointer group"
        >
          <i id="copyIcon" class="fa-regular fa-copy text-purple-400 group-hover:text-purple-300 text-lg"></i>
          <span id="copyBtnText">Copy the IP!</span>
        </button>

      </div>

    </div>
  </div>

  <!-- Footer & License Disclaimer -->
  <footer class="w-full max-w-lg text-center py-4 text-xs text-slate-400 space-y-2">
    <p class="font-medium text-slate-400">&copy; <span id="year"></span> VoidDupe. All rights reserved.</p>
    <p class="text-[11px] leading-relaxed text-slate-500">
      Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.
    </p>
  </footer>

  <!-- Toast Confirmation Message -->
  <div 
    id="toast" 
    class="fixed bottom-6 left-1/2 -translate-x-1/2 hidden bg-purple-950/90 border border-purple-500/50 text-white text-sm font-medium px-5 py-2.5 rounded-full shadow-2xl backdrop-blur-md z-50 items-center gap-2"
  >
    <i class="fa-solid fa-circle-check text-purple-400"></i>
    <span>IP copied to clipboard! (<span id="toastIp" class="text-purple-300 font-mono">play.voiddupe.net</span>)</span>
  </div>

  <script>
    // Configuration Object
    const CONFIG = {
      SERVER_IP: "play.voiddupe.net",
      DISCORD_INVITE_CODE: "bZWS24azkf"
    };

    // Set Copyright Year
    document.getElementById('year').textContent = new Date().getFullYear();

    /**
     * Copy Server IP to Clipboard
     */
    function copyServerIp() {
      const ip = CONFIG.SERVER_IP;
      
      // Fallback execCommand for iframe compatibility
      const tempInput = document.createElement('input');
      tempInput.value = ip;
      document.body.appendChild(tempInput);
      tempInput.select();
      
      try {
        document.execCommand('copy');
        showCopyFeedback();
      } catch (err) {
        console.error('Failed to copy IP', err);
      } finally {
        document.body.removeChild(tempInput);
      }
    }

    /**
     * Visual Confirmation for Copy IP action
     */
    function showCopyFeedback() {
      const copyIcon = document.getElementById('copyIcon');
      const copyBtnText = document.getElementById('copyBtnText');
      const toast = document.getElementById('toast');
      const toastIp = document.getElementById('toastIp');

      // Update button text and icon
      copyIcon.className = "fa-solid fa-check text-green-400 text-lg";
      copyBtnText.textContent = "IP Copied!";

      // Show toast alert
      toastIp.textContent = CONFIG.SERVER_IP;
      toast.classList.remove('hidden');
      toast.classList.add('flex', 'animate-toast');

      // Reset state after 2.5 seconds
      setTimeout(() => {
        copyIcon.className = "fa-regular fa-copy text-purple-400 group-hover:text-purple-300 text-lg";
        copyBtnText.textContent = "Copy the IP!";
        toast.classList.add('hidden');
        toast.classList.remove('flex', 'animate-toast');
      }, 2500);
    }

    /**
     * Fetch Live Discord Server Name, Logo, Online Count, and Total Members
     */
    async function fetchDiscordServerStats() {
      const iconEl = document.getElementById('discordIcon');
      const nameEl = document.getElementById('discordName');
      const onlineEl = document.getElementById('discordOnlineCount');
      const totalEl = document.getElementById('discordTotalCount');

      try {
        const response = await fetch(`https://discord.com/api/v9/invites/${CONFIG.DISCORD_INVITE_CODE}?with_counts=true`);
        
        if (response.ok) {
          const data = await response.json();

          if (data.guild) {
            // Server Name
            if (data.guild.name) {
              nameEl.textContent = data.guild.name;
            }

            // Server Logo Icon
            if (data.guild.icon) {
              const iconUrl = `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.png?size=256`;
              iconEl.src = iconUrl;
            }

            // Live Online & Total Member Counts
            if (data.approximate_presence_count !== undefined) {
              onlineEl.textContent = `${data.approximate_presence_count.toLocaleString()} Online`;
            }
            if (data.approximate_member_count !== undefined) {
              totalEl.textContent = `${data.approximate_member_count.toLocaleString()} Members`;
            }
          }
        } else {
          throw new Error('Discord API response not ok');
        }
      } catch (err) {
        console.warn('Could not fetch Discord invite data:', err);
        onlineEl.textContent = "Active Community";
        totalEl.textContent = "Discord Server";
      }
    }

    // Execute Discord data fetch on window load
    window.onload = function() {
      fetchDiscordServerStats();
    };
  </script>

</body>
</html>
