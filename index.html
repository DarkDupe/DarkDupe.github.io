<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="DarkDupe Minecraft server — currently in development.">
  <title>DarkDupe</title>
  <style>
    :root {
      --black: #050505;
      --panel: rgba(15, 15, 16, .88);
      --line: rgba(210, 210, 215, .22);
      --silver: #e5e5e7;
      --muted: #929298;
      --soft: #bfc0c5;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--black); }
    body {
      margin: 0; min-height: 100vh; color: var(--silver);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(95, 95, 102, .13), transparent 48%),
        linear-gradient(180deg, #080808 0%, #030303 100%);
      display: flex; flex-direction: column; align-items: center;
      padding: 28px 18px 20px; overflow-x: hidden; isolation: isolate;
    }
    #starfield {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: -1; pointer-events: none; opacity: .8;
    }
    .ambient {
      position: fixed; inset: -20%; z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 48%, rgba(180,180,190,.055), transparent 48%);
      animation: ambient-drift 16s ease-in-out infinite alternate;
    }
    .page { width: min(100%, 720px); margin: auto; display: flex; flex-direction: column; align-items: center; flex: 1; }
    .brand { width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; margin: 18px auto 28px; }
    
    /* Removed background, border, box-shadow, and rotation from the mark container so only the image shows cleanly */
    .brand-mark {
      width: 72px; height: 72px; margin-bottom: 16px; display: grid; place-items: center;
      background: none; border: none; box-shadow: none; transform: none;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; transform: none; }
    .brand-mark span {
      transform: none; font-size: 28px; line-height: 1; font-weight: 900;
      color: #e9e9ec; text-shadow: 0 0 18px rgba(220,220,230,.25);
    }

    .brand-name { margin: 0; font-size: clamp(34px, 7vw, 54px); line-height: 1; letter-spacing: .12em; font-weight: 900; color: #f1f1f2; text-indent: .12em; }
    .brand-name span { color: #77777e; }
    .brand-subtitle { margin: 15px 0 0; color: #9a9aa1; font-size: 10px; font-weight: 700; letter-spacing: .42em; text-transform: uppercase; padding-left: .42em; }
    .brand-divider { width: min(78%, 300px); height: 1px; margin-top: 24px; background: linear-gradient(90deg, transparent, #77777e, #dedee2, #77777e, transparent); opacity: .7; }
    .glass-card {
      width: min(100%, 555px); padding: 32px 34px 27px; border: 1px solid var(--line); border-radius: 22px;
      background: linear-gradient(145deg, rgba(22,22,24,.91), rgba(7,7,8,.94));
      box-shadow: 0 0 0 1px rgba(255,255,255,.025), 0 26px 80px rgba(0,0,0,.58), inset 0 1px rgba(255,255,255,.055);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      text-align: center; position: relative; overflow: hidden;
    }
    .glass-card::before {
      content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 100px; height: 2px; border-radius: 99px; background: #d5d5da;
      box-shadow: 0 0 14px rgba(220,220,230,.24);
    }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 38px); line-height: 1.12; font-weight: 850; letter-spacing: -.035em; color: #f4f4f5; }
    .status { display: inline-flex; align-items: center; justify-content: center; gap: 9px; margin: 15px 0 28px; color: #c2c2c8; font-size: 11px; letter-spacing: .19em; font-weight: 800; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #c5c5cb; box-shadow: 0 0 10px rgba(220,220,230,.5); animation: pulse 2.2s ease-in-out infinite; }
    .actions { display: grid; gap: 13px; width: 100%; }
    .action {
      width: 100%; min-height: 64px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 16px;
      padding: 16px 20px; font: inherit; font-weight: 800; font-size: clamp(13px, 2.5vw, 16px);
      letter-spacing: .06em; color: #f5f5f6; text-transform: uppercase; user-select: none;
    }
    .discord-btn {
      border: 1px solid rgba(225,225,230,.28);
      background: linear-gradient(105deg, #343438, #202023 52%, #303034);
      box-shadow: 0 8px 24px rgba(0,0,0,.3), inset 0 1px rgba(255,255,255,.12);
      cursor: default;
    }
    .ip-btn {
      border: 1px solid rgba(210,210,218,.48); background: rgba(8,8,9,.7);
      box-shadow: inset 0 0 18px rgba(255,255,255,.025);
      cursor: pointer; transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .ip-btn:hover { background: rgba(75,75,82,.22); border-color: rgba(235,235,240,.72); transform: translateY(-1px); }
    .discord-symbol { width: 22px; height: 22px; display: inline-flex; flex: 0 0 22px; color: #ededf0; }
    .discord-symbol svg { width: 100%; height: 100%; display: block; }
    .cube-symbol { color: #d2d2d7; font-size: 24px; line-height: 1; }
    .arrow { font-size: 24px; font-weight: 400; margin-left: 4px; color: #c9c9ce; }
    .copy-symbol { color: #bdbdc4; font-size: 21px; margin-left: 8px; }
    .card-footer { margin: 26px 0 0; color: #aaaab1; font-size: 10px; font-weight: 800; letter-spacing: .34em; text-transform: uppercase; padding-left: .34em; }
    footer { width: 100%; text-align: center; margin-top: 22px; padding: 0 8px; color: rgba(205,205,212,.48); font-size: 10px; letter-spacing: .02em; }
    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 5;
      border: 1px solid rgba(210,210,218,.35); background: rgba(15,15,17,.97); color: #f2f2f4;
      border-radius: 999px; padding: 12px 19px; box-shadow: 0 8px 32px rgba(0,0,0,.5);
      font-size: 12px; font-weight: 800; letter-spacing: .12em; opacity: 0; pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -5px); }
    @keyframes pulse { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
    @keyframes ambient-drift { from { transform: translate3d(-1%, -1%, 0) scale(1); } to { transform: translate3d(1%, 1%, 0) scale(1.08); } }
    @media (max-width: 600px) {
      body { padding: 16px 13px; }
      .brand { margin-top: 12px; margin-bottom: 22px; }
      .brand-mark { width: 60px; height: 60px; }
      .brand-subtitle { font-size: 9px; letter-spacing: .32em; }
      .glass-card { padding: 28px 18px 23px; border-radius: 19px; }
      .action { min-height: 59px; border-radius: 13px; gap: 12px; }
      .card-footer { letter-spacing: .22em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="ambient" aria-hidden="true"></div>
  <main class="page">
    <header class="brand" aria-label="DarkDupe Minecraft Server">
      <div class="brand-mark" aria-hidden="true"><img src="https://github.com/DarkDupe.png" alt=""></div>
      <p class="brand-name">DARK<span>DUPE</span></p>
      <p class="brand-subtitle">Minecraft Server</p>
      <div class="brand-divider" aria-hidden="true"></div>
    </header>

    <section class="glass-card" aria-labelledby="server-title">
      <h1 id="server-title">DarkDupe</h1>
      <div class="status"><span class="status-dot"></span><span>IN DEVELOPMENT</span></div>
      <div class="actions">
        <button class="action discord-btn" type="button" aria-label="Discord invite coming soon">
          <span class="discord-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" aria-label="Discord" xmlns="http://www.w3.org/2000/svg">
              <path fill="currentColor" d="M19.7 5.3a18.2 18.2 0 0 0-4.5-1.4l-.6 1.2a16.8 16.8 0 0 0-5.1 0l-.6-1.2a18.2 18.2 0 0 0-4.5 1.4C1.6 9.5.8 13.6 1.2 17.7a18.4 18.4 0 0 0 5.5 2.8l1.2-1.9-1.8-.9.4-.3c3.5 1.6 7.4 1.6 10.9 0l.4.3-1.8.9 1.2 1.9a18.4 18.4 0 0 0 5.5-2.8c.5-4.7-.8-8.8-3-12.4ZM8.7 14.9c-1.1 0-2-.9-2-2.1s.9-2.1 2-2.1 2 .9 2 2.1-.9 2.1-2 2.1Zm6.6 0c-1.1 0-2-.9-2-2.1s.9-2.1 2-2.1 2 .9 2 2.1-.9 2.1-2 2.1Z"/>
            </svg>
          </span>
          <span>Join Discord</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
        <button class="action ip-btn" id="development-button" type="button">
          <span class="cube-symbol" aria-hidden="true">⬡</span>
          <span id="button-label">Server IP</span>
          <span class="copy-symbol" aria-hidden="true">▢</span>
        </button>
      </div>
      <p class="card-footer">Build&nbsp; • &nbsp;Dupe&nbsp; • &nbsp;Dominate</p>
    </section>
  </main>
  <footer>© <span id="year"></span> DarkDupe. All rights reserved. · Not affiliated with Mojang Studios or Microsoft.</footer>
  <div class="toast" id="toast" role="status" aria-live="polite">IN DEVELOPMENT</div>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const developmentButton = document.getElementById('development-button');
    const buttonLabel = document.getElementById('button-label');
    const toast = document.getElementById('toast');
    let toastTimer;
    developmentButton.addEventListener('click', () => {
      buttonLabel.textContent = 'IN DEVELOPMENT';
      toast.classList.add('show');
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => {
        toast.classList.remove('show');
        buttonLabel.textContent = 'Server IP';
      }, 2200);
    });

    (() => {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let width = 0, height = 0, stars = [], dpr = 1;
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.min(150, Math.max(55, Math.floor(width * height / 9500)));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.35 + .25,
          alpha: Math.random() * .55 + .15,
          speed: Math.random() * .16 + .025,
          phase: Math.random() * Math.PI * 2,
          twinkle: Math.random() * .018 + .004
        }));
      }
      let frame = 0;
      function draw() {
        ctx.clearRect(0, 0, width, height);
        for (const s of stars) {
          const shimmer = reduceMotion ? 0 : Math.sin(frame * s.twinkle + s.phase) * .18;
          const a = Math.max(.08, Math.min(.85, s.alpha + shimmer));
          ctx.beginPath();
          ctx.fillStyle = `rgba(225,225,232,${a})`;
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
          if (!reduceMotion) {
            s.y -= s.speed;
            if (s.y < -3) { s.y = height + 3; s.x = Math.random() * width; }
          }
        }
        if (!reduceMotion) frame++;
        if (!reduceMotion) requestAnimationFrame(draw);
      }
      resize();
      draw();
      window.addEventListener('resize', resize, { passive: true });
    })();
  </script>
</body>
</html>
